<body>

<canvas id="fx" aria-hidden="true"></canvas>

<button class="music off" id="music" type="button" aria-label="Bật nhạc" aria-pressed="false">

  <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i></span>
  <span id="musicLabel">Nhạc</span>
</button>

<!-- Cảnh 0: Phong thư mở đầu -->
<section class="intro" id="intro">
  <canvas id="petalsIntro" aria-hidden="true"></canvas>
  <div class="intro-card">
    <div class="intro-wax" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <p class="for" id="introTo"></p>
    <p class="say" id="introSay"></p>
    <button class="open-btn" id="openBtn" type="button">
      <span>Mở món quà nhỏ</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</section>

<!-- Cảnh 2: Bức thư, Vườn hoa, Trình phát nhạc & Theo dõi Trái Tim Hải Phòng -> Gia Lai -->
<main class="letter-scene" id="letter" inert aria-hidden="true">
  <canvas class="petals-bg" id="petalsLetter" aria-hidden="true"></canvas>
  <div class="sheet">
    <div class="paper-card">
      <div class="letter-ornament" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <h1>
        <span id="h1a">Chúc mừng</span>
        <span id="h1b">sinh nhật,</span>
        <span id="hName"></span>
      </h1>
      <div id="paras"></div>
      <div id="photos"></div>
      <div class="garden-wrap" id="gardenSlot"></div>
      <p class="closing" id="closing"></p>
      <p class="from" id="from"></p>
