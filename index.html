<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C12">
<title>Gửi em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tracking.css">
</head>
<body>

<canvas id="bgCanvas" aria-hidden="true"></canvas>

<main class="scene" id="letter">
  <div class="sheet">
    <article class="note-card">
      <div class="note-line" aria-hidden="true"></div>
      <p class="note-msg" id="noteMsg">Cảm ơn em, lần tiếp theo em mở web cũng là lúc anh với em không còn là gì. Anh mệt, anh ghen, chắc do anh là người ghen tuông mù quáng thôi, anh cũng muốn làm hòa với em và anh cũng thử rồi nhưng chắc muộn rồi. Chúc em hạnh phúc</p>
      <div id="trackingAnchor"></div>
    </article>
  </div>
</main>

<script src="script.js"></script>
<script src="tracking.js"></script>
</body>
</html>
